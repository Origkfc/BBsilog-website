<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBSILOG · Feedback Admin</title><style>body{margin:0;background:#fff4d4;color:#35180b;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px 18px}h1,h2{margin:0 0 12px}.panel,.review{background:#fffaf0;border:1px solid #edc984;border-radius:18px;padding:20px;margin:15px 0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d4a451;border-radius:10px;font:inherit}button{background:#ffb216;color:#35180b;padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#f5e4bd}button:disabled{opacity:.5;cursor:not-allowed}.note{color:#72543a;font-size:14px}.error{color:#9e250d}#filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}#filters button{flex-shrink:0;margin:0;background:#f5e4bd}#filters button.active{background:#35180b;color:#ffe16d}.review .danger{background:#fff0e7;color:#9e250d;border:1px solid #dd9f84}.review p{white-space:pre-wrap;overflow-wrap:anywhere}.review small{color:#72543a}</style></head><body><main><h1>🍳 BBSILOG Feedback Admin</h1><p class="note">Private inbox · Reviews are public only after customer permission and your approval.</p><section id="login" class="panel"><h2>ADMIN sign in</h2><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><section id="inbox" hidden><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button><h2>Feedback inbox</h2><div id="filters" role="group" aria-label="Filter feedback"></div><div id="list"></div></section><p id="status" role="status"></p></main><script>
const base='https://ufhblydcgwffwpwdlksm.supabase.co', key='sb_publishable_d10Qrzk0LHaoVYnttjtOyQ_g-049cX3';let token=sessionStorage.getItem('bbsilog_feedback_token')||null;const status=document.getElementById('status');function say(message,error=false){status.textContent=message;status.className=error?'error':'note'}async function request(path,options={}){const res=await fetch(base+path,{...options,headers:{apikey:key,Authorization:'Bearer '+(token||key),'Content-Type':'application/json',...(options.headers||{})}});if(!res.ok)throw Error('Request failed ('+res.status+'). Check project setup or admin access.');return res.status===204?null:res.json()}let feedbackRows=[],currentFilter='all';function render(){const filters=document.getElementById('filters');filters.replaceChildren();const choices=[['all','All'],['pending','Pending'],['approved','Approved'],['private','Private'],['rejected','Not featured'],['archived','Deleted / Archived']];for(const [value,label] of choices){const count=feedbackRows.filter(r=>value==='archived'?!!r.archived_at:!r.archived_at&&(value==='all'||(value==='private'?!r.publish_consent:value==='pending'?r.publish_consent&&r.status==='pending':r.publish_consent&&r.status===value))).length;const button=document.createElement('button');button.type='button';button.className=value===currentFilter?'active':'';button.setAttribute('aria-pressed',String(value===currentFilter));button.textContent=label+' ('+count+')';button.addEventListener('click',()=>{currentFilter=value;render()});filters.append(button)}const list=document.getElementById('list');list.replaceChildren();const rows=feedbackRows.filter(r=>currentFilter==='archived'?!!r.archived_at:!r.archived_at&&(currentFilter==='all'||(currentFilter==='private'?!r.publish_consent:currentFilter==='pending'?r.publish_consent&&r.status==='pending':r.publish_consent&&r.status===currentFilter)));if(!rows.length){list.textContent='No feedback in this category.';return}for(const row of rows){const card=document.createElement('article');card.className='review';const title=document.createElement('strong');title.textContent=(row.customer_name||'Anonymous')+' · '+'★'.repeat(row.rating);const msg=document.createElement('p');msg.textContent=row.message;const detail=document.createElement('small');detail.textContent=(row.publish_consent?'Permission to feature: Yes':'Private: no permission to feature')+' · '+(row.archived_at?'archived':row.status)+' · '+new Date(row.created_at).toLocaleString();card.append(title,msg,detail);if(row.publish_consent&&!row.archived_at){for(const [label,state] of [['Approve & feature','approved'],['Remove from website','rejected']]){const button=document.createElement('button');button.textContent=label;button.disabled=row.status===state;button.addEventListener('click',async()=>{button.disabled=true;try{const updated=await request('/rest/v1/bbsilog_feedback?id=eq.'+encodeURIComponent(row.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status:state})});if(!Array.isArray(updated)||updated.length!==1)throw Error('Could not update this feedback.');await load()}catch(e){say(e.message,true);button.disabled=false}});card.append(button)}}const del=document.createElement('button');del.className='danger';del.textContent=row.archived_at?'Restore feedback':'Move to archive';del.addEventListener('click',async()=>{del.disabled=true;try{const updated=await request('/rest/v1/bbsilog_feedback?id=eq.'+encodeURIComponent(row.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({archived_at:row.archived_at?null:new Date().toISOString(),status:'pending'})});if(!Array.isArray(updated)||updated.length!==1)throw Error('Could not update the archive.');await load()}catch(e){say(e.message,true);del.disabled=false}});card.append(del);list.append(card)}}async function load(){say('Loading feedback…');try{feedbackRows=await request('/rest/v1/bbsilog_feedback?select=id,customer_name,rating,message,publish_consent,status,created_at,archived_at&order=created_at.desc');render();say('')}catch(e){say(e.message,true)}}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();say('Signing in…');try{const result=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});token=result.access_token;const isAdmin=await request('/rest/v1/rpc/bbsilog_is_feedback_admin',{method:'POST',body:'{}'});if(!isAdmin)throw Error('Account is not authorized.');sessionStorage.setItem('bbsilog_feedback_token',token);document.getElementById('password').value='';document.getElementById('login').hidden=true;document.getElementById('inbox').hidden=false;await load()}catch(e){token=null;sessionStorage.removeItem('bbsilog_feedback_token');say('Sign-in failed. Check the admin account and password.',true)}});document.getElementById('refresh').addEventListener('click',load);document.getElementById('logout').addEventListener('click',()=>{token=null;sessionStorage.removeItem('bbsilog_feedback_token');document.getElementById('inbox').hidden=true;document.getElementById('login').hidden=false;document.getElementById('list').replaceChildren();say('Signed out on this page.')});
if(token){request('/rest/v1/rpc/bbsilog_is_feedback_admin',{method:'POST',body:'{}'}).then(ok=>{if(!ok)throw Error('Not authorized');document.getElementById('login').hidden=true;document.getElementById('inbox').hidden=false;return load()}).catch(()=>{token=null;sessionStorage.removeItem('bbsilog_feedback_token');say('Session expired. Please sign in again.',true)})}</script></body></html>
