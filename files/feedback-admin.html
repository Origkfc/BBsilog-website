<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBSILOG · Feedback Admin</title><style>body{margin:0;background:#fff4d4;color:#35180b;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px 18px}h1,h2{margin:0 0 12px}.panel,.review{background:#fffaf0;border:1px solid #edc984;border-radius:18px;padding:20px;margin:15px 0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d4a451;border-radius:10px;font:inherit}button{background:#ffb216;color:#35180b;padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#f5e4bd}button:disabled{opacity:.5;cursor:not-allowed}.note{color:#72543a;font-size:14px}.error{color:#9e250d}#filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}#filters button{flex-shrink:0;margin:0;background:#f5e4bd}#filters button.active{background:#35180b;color:#ffe16d}.review .danger{background:#fff0e7;color:#9e250d;border:1px solid #dd9f84}.review p{white-space:pre-wrap;overflow-wrap:anywhere}.review small{display:block;color:#72543a;line-height:1.6;overflow-wrap:anywhere}.review-identity .edit-name-button{flex:0 0 auto;margin:0 0 0 2px;padding:5px 9px;border:1px solid #edc984;border-radius:9px;background:#fff4d4;font-size:17px;line-height:1;box-shadow:none}.review-identity .edit-name-button:hover{background:#ffe6a2}.name-editor{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.name-editor[hidden]{display:none}.name-editor input{flex:1 1 220px;max-width:420px}.name-editor button{margin:0}.name-editor button.secondary{border:1px solid #edc984}</style><link rel="stylesheet" href="/files/reviews.css?v=20261031-review-motion-fix"></head><body><main><h1>🍳 BBSILOG Feedback Admin</h1><p class="note">Private inbox · Website feedback requires customer permission. Imported Messenger reviews are labeled and approved by BBSILOG.</p><section id="login" class="panel"><h2>ADMIN sign in</h2><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><section id="inbox" hidden><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button><h2>Feedback inbox</h2><div id="filters" role="group" aria-label="Filter feedback"></div><div id="list"></div></section><p id="status" role="status"></p></main><script src="/files/review-model.js?v=20261031-review-motion-fix"></script><script src="/files/feedback-admin.js?v=20261031-review-motion-fix"></script></body></html>
